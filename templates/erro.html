{% extends "base.html" %}
{% block title %}Erro{% endblock %}
{% block page_class %}page-sm{% endblock %}
{% block head %}
<style>
.err-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 140px);
  padding: 40px 20px;
}
.err-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r3);
  padding: 40px 36px;
  width: 100%; max-width: 440px;
  text-align: center;
  box-shadow: var(--s2);
}
.err-icon {
  width: 64px; height: 64px;
  border-radius: 16px;
  background: linear-gradient(135deg, #fff4e8 0%, #ffe4cc 100%);
  border: 1px solid #f0c8a0;
  color: var(--orange);
  font-size: 32px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 18px;
}
.err-title {
  font-size: 22px; font-weight: 700;
  color: var(--brown); margin-bottom: 8px;
  line-height: 1.3;
}
.err-sub {
  font-size: 13px; color: var(--muted);
  margin-bottom: 24px; line-height: 1.5;
}
.err-actions {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.err-actions .btn { padding: 9px 18px; }
@media (max-width: 700px) {
  .err-wrap { padding: 24px 14px; min-height: calc(100vh - 100px); }
  .err-card { padding: 28px 20px; border-radius: var(--r2); }
  .err-icon { width: 52px; height: 52px; font-size: 26px; }
  .err-title { font-size: 18px; }
  .err-sub { font-size: 12px; margin-bottom: 18px; }
  .err-actions { flex-direction: column; }
  .err-actions .btn { width: 100%; justify-content: center; padding: 12px; }
}
[data-theme="dark"] .err-icon { background: linear-gradient(135deg, #2c2114 0%, #33240f 100%); border-color: #5a4630; }
</style>
{% endblock %}
{% block content %}
<div class="err-wrap">
  <div class="err-card">
    <div class="err-icon">!</div>
    <div class="err-title">{{ msg }}</div>
    <div class="err-sub">
      Se o problema persistir, contactar o responsável pela gestão de escalas.
    </div>
    <div class="err-actions">
      <a href="/" class="btn btn-primary">Voltar ao início</a>
      <button class="btn btn-ghost" onclick="history.back()">Página anterior</button>
    </div>
  </div>
</div>
{% endblock %}
